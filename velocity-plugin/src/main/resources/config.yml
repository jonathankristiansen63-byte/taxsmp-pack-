# TaxSMP PackLoader
# Sends the TaxSMP resource pack once when a player joins this proxy, while they're still on the joining screen.
# Switching between NA and EU keeps the pack loaded, so it is not sent again.

# Where the pack lives on GitHub.
github-repo: "jonathankristiansen63-byte/taxsmp-pack-"
github-branch: "main"
pack-path: "dist/TaxSMP-Pack.zip"

# Keep this the same forever. Pack updates then replace the old pack instead of stacking on top of it.
pack-id: "b1c37d58-7d24-4ea8-abd6-e63cae91af50"

# true = the pack is required: players who decline it can't play.
force: true

# true = also keep players on the joining screen until the pack has loaded (with force: true).
# If they don't load it within accept-timeout-seconds, they get disconnected with kick-message.
# false = they join right away and the pack loads in the background.
wait-for-pack: true
accept-timeout-seconds: 120
kick-message: "&cYou have to accept the &6&lTaxSMP &cresource pack to play!\n&7Rejoin and click &fYes&7."

# Text on Minecraft's resource pack screen. Supports & color codes.
prompt: "&6&lTaxSMP &fneeds its resource pack to play!"

# How often (in minutes) to check GitHub for a new version of the pack. 0 = only on startup and /taxpack reload.
check-every-minutes: 10

# Don't send the Java pack to Bedrock players (needs Floodgate on this proxy).
skip-bedrock: true
