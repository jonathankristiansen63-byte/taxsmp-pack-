name: Build pack

on:
  push:
    branches: [main]
    paths:
      - "pack/**"
      - "bedrock/**"
      - "build.py"
      - "tools/bedrock_buttons.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependencies
        run: python -m pip install "Pillow>=11,<13"
      - name: Build Java pack
        run: python build.py
      - name: Build Bedrock pack
        run: python tools/bedrock_buttons.py
      - name: Commit the rebuilt packs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || { git commit -m "Rebuild pack zip"; git push; }
